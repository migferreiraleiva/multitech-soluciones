<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiTech Soluciones - Panel de Soporte</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header-principal">
        <div class="logo-contenedor">
            <h1>MultiTech Soluciones</h1>
            <span class="badge-servidor">Sistema de Soporte TI</span>
        </div>
        <div class="usuario-info">
            <p><strong>Técnico:</strong> Miguel Ferreira Leiva</p>
        </div>
    </header>

    <main class="contenedor-main">
        <section class="titulo-seccion">
            <h2>Empresas Clientes - Panel de Soporte</h2>
            <p>Seleccione una empresa para gestionar sus activos, tickets y evidencias.</p>
        </section>

        <!-- Matriz Grid Nivel 1: Cuadros de Clientes -->
        <section class="grid-clientes">
            <article class="tarjeta-cliente wildlama">
                <h3>Wildlama</h3>
            </article>

            <article class="tarjeta-cliente marchigue">
                <h3>Marchigüe</h3>
            </article>

            <article class="tarjeta-cliente almendral">
                <h3>Almendral</h3>
            </article>

            <article class="tarjeta-cliente emu">
                <h3>Emmu</h3>
            </article>

            <article class="tarjeta-cliente linkcapital">
                <h3>Link Capital</h3>
            </article>

            <article class="tarjeta-cliente conventoviejo">
                <h3>Convento Viejo</h3>
            </article>

            <article class="tarjeta-cliente penta">
                <h3>Empresa Penta</h3>
            </article>

            <article class="tarjeta-cliente altamarcam">
                <h3>Altamarcam</h3>
            </article>

            <article class="tarjeta-cliente ljtax">
                <h3>LJTAX</h3>
            </article>
        </section>
    </main>
</body>
</html>
